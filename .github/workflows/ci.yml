# CI workflow for the feature/1.0.x line (JDK 8)
#
# Triggers:
#   - version branch, main and test/* push / pull_request
#   - manual workflow_dispatch
#
# Runs `bash ./mvnw -B clean verify` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=true) configured in the POM.
name: CI

on:
  push:
    branches: [feature/1.0.x, main, 'test/*']
  pull_request:
    branches: [feature/1.0.x, main, 'test/*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 / Tika ${{ matrix.tika }}
    strategy:
      fail-fast: false
      matrix:
        tika: ['baseline']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify with JaCoCo coverage gate
        env:
          TIKA_PROFILE: ${{ matrix.tika }}
        run: |
          args=()
          if [[ "$TIKA_PROFILE" != "baseline" ]]; then
            args+=("-P$TIKA_PROFILE")
          fi
          bash ./mvnw -B --no-transfer-progress "${args[@]}" clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-${{ matrix.tika }}
          path: target/site/jacoco
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.tika }}
          path: target/surefire-reports
          retention-days: 14
